
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#071510">
    <meta name="description" content="Alnoor Global Trades and Export — website under construction.">

    <title>Alnoor Global Trades and Export</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="grid-overlay"></div>
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
    </div>

    <main class="page">

        <header class="header reveal">
            <a class="brand" href="#" aria-label="Alnoor home">
                <span class="brand-mark">
                    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                        <path d="M24 4L43 39H5L24 4Z"
                              stroke="currentColor" stroke-width="1.5"/>
                        <path d="M24 16L35 36H13L24 16Z"
                              fill="currentColor" opacity=".3"/>
                        <path d="M24 16V36M13 36L24 16L35 36"
                              stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </span>

                <span class="brand-name">
                    <strong>ALNOOR</strong>
                    <small>GLOBAL TRADES &amp; EXPORT</small>
                </span>
            </a>

            <div class="header-status">
                <span class="status-dot"></span>
                <span>COMING SOON</span>
            </div>
        </header>

        <section class="hero">

            <div class="hero-content">

                <div class="eyebrow reveal">
                    <span class="eyebrow-line"></span>
                    <span>A NEW CHAPTER BEGINS</span>
                    <span class="eyebrow-line"></span>
                </div>

                <h1 class="reveal">
                    Something<br>
                    <span class="title-accent">extraordinary</span><br>
                    is on its way<span class="gold-dot">.</span>
                </h1>

                <div class="divider-line reveal">
                    <span></span>
                    <i></i>
                    <span></span>
                </div>

                <div class="construction reveal">
                    <span class="construction-icon">
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.5">
                            <path d="M12 3L22 21H2L12 3Z"/>
                            <path d="M12 9V14M12 17.5V18"/>
                        </svg>
                    </span>

                    <span>WEBSITE UNDER CONSTRUCTION</span>
                </div>

                <div class="hero-bottom reveal">
                    <span class="bottom-line"></span>
                    <span class="bottom-caption">A NEW DIGITAL PRESENCE IS TAKING SHAPE</span>
                    <span class="bottom-line"></span>
                </div>

            </div>

            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

        </section>

        <footer class="footer reveal">
            <span class="footer-brand">ALNOOR <span>GLOBAL</span></span>

            <div class="footer-center">
                <span class="footer-dot"></span>
                <span>UNDER CONSTRUCTION</span>
            </div>

            <time id="clock" class="clock" aria-label="Current local time">
                --:--:--
            </time>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
